[project]
name = "google-adk-practice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "google-adk>=2.6.3",
    "litellm>=1.96.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # import sorting
  "B",             # bugbear
]
ignore = ["E501"]  # long strings/comments; the formatter doesn't wrap these


